name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "ansible/deploy-app.yml"
      - ".github/workflows/app-cicd.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: devops-bootcamp-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECR_URL: ${{ vars.ECR_URL }}
  CONTROLLER_INSTANCE_ID: ${{ vars.CONTROLLER_INSTANCE_ID }}

jobs:

  build-push-deploy:

    name: Build, Push and Deploy

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6


      # ======================================================
      # CI - Build and test Docker image
      # ======================================================

      - name: Build application image
        run: |
          docker build \
            --tag local/devops-bootcamp:${GITHUB_SHA} \
            ./app


      - name: Test application container
        run: |
          docker run \
            --detach \
            --name ship-ci-test \
            --publish 8080:80 \
            local/devops-bootcamp:${GITHUB_SHA}

          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              echo "Application container health check passed."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Application failed CI health check."
          docker logs ship-ci-test
          exit 1


      - name: Stop CI test container
        if: always()
        run: |
          docker rm -f ship-ci-test 2>/dev/null || true


      # ======================================================
      # AWS authentication - OIDC
      # ======================================================

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["sub", "aud", "repository", "ref", "event_name"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-devops-bootcamp
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: aws sts get-caller-identity


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================
      # CD - Build production image and push to ECR
      #
      # Every deployment gets an immutable Git commit SHA tag.
      # "latest" is kept for convenient viewing.
      # ======================================================

      - name: Build and tag production image
        run: |
          docker build \
            --tag "${ECR_URL}:${GITHUB_SHA}" \
            --tag "${ECR_URL}:latest" \
            ./app


      - name: Push image to Amazon ECR
        run: |
          docker push "${ECR_URL}:${GITHUB_SHA}"
          docker push "${ECR_URL}:latest"


      # ======================================================
      # Deployment
      #
      # GitHub does not directly configure the web server.
      #
      # GitHub → SSM → Ansible Controller → Web Server
      # ======================================================

      - name: Deploy using Ansible Controller
        id: deploy
        shell: bash
        run: |
          PARAMETERS=$(jq -n \
            --arg ecr "${ECR_URL}" \
            --arg tag "${GITHUB_SHA}" \
            '{
              commands: [
                "sudo -u ubuntu git -C /home/ubuntu/devops-bootcamp-project pull --ff-only",
                ("cd /home/ubuntu/devops-bootcamp-project/ansible && sudo -u ubuntu ansible-playbook deploy-app.yml -e \"ecr_repository_url=" + $ecr + " image_tag=" + $tag + "\"")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${CONTROLLER_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --comment "Deploy ${GITHUB_SHA} using Ansible" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          echo "SSM command: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${CONTROLLER_INSTANCE_ID}" || true

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${CONTROLLER_INSTANCE_ID}"


      - name: Verify Ansible deployment succeeded
        shell: bash
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${CONTROLLER_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "Deployment status: ${STATUS}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Ansible deployment failed."
            exit 1
          fi


      # ======================================================
      # Final end-to-end verification
      # ======================================================

      - name: Verify production website
        run: |
          for attempt in {1..12}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              https://web.ahmadmunim.asia/ > /dev/null; then

              echo "Production website is healthy."
              exit 0

            fi

            echo "Waiting for production deployment..."
            sleep 5

          done

          echo "Production verification failed."
          exit 1


      - name: Deployment summary
        run: |
          echo "========================================"
          echo "DEVOPS BOOTCAMP DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "Commit: ${GITHUB_SHA}"
          echo "Image : ${ECR_URL}:${GITHUB_SHA}"
          echo "URL   : https://web.ahmadmunim.asia"
