---
- name: Deploy DevOps Bootcamp application
  hosts: web
  become: true
  gather_facts: true

  vars:
    aws_region: "ap-southeast-1"
    container_name: "ship-app"
    application_port: 80

  tasks:
    - name: Ensure Docker Python library and AWS CLI prerequisites are installed
      ansible.builtin.apt:
        name:
          - python3-docker
          - curl
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check whether AWS CLI v2 is installed
      ansible.builtin.stat:
        path: /usr/local/bin/aws
      register: aws_cli

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"
      when: not aws_cli.stat.exists

    - name: Extract AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: not aws_cli.stat.exists

    - name: Install AWS CLI v2
      ansible.builtin.command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws
      when: not aws_cli.stat.exists

    - name: Verify AWS CLI installation
      ansible.builtin.command: aws --version
      register: aws_version
      changed_when: false

    - name: Login Docker to private Amazon ECR
      ansible.builtin.shell: >
        aws ecr get-login-password
        --region {{ aws_region }}
        | docker login
        --username AWS
        --password-stdin
        {{ ecr_repository_url.split('/')[0] }}
      changed_when: false
      no_log: true

    - name: Pull application image from ECR
      community.docker.docker_image:
        name: "{{ ecr_repository_url }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Run application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ ecr_repository_url }}:{{ image_tag }}"
        state: started
        restart_policy: always
        published_ports:
          - "{{ application_port }}:80"

    - name: Verify application responds locally
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ application_port }}"
        status_code: 200
